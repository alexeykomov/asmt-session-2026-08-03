# FunWithActivity edge — nginx.
#
# This is the EDGE tier, and it is deliberately separate from web-proxy.
# web-proxy is an application tier (a BFF for browsers: REST + static assets).
# Edge concerns — TLS termination, rate limiting, routing, and later WAF and
# DDoS controls — belong here, in front of BOTH backends.
#
#   nginx (TLS, rate limit, route)
#     ├── /funwithactivity.recommendations.v1.*  →  app-server  (grpc_pass, HTTP/2)
#     └── /                                      →  web-proxy   (proxy_pass, HTTP/1.1)
#
# Why this exists at all: DigitalOcean App Platform's ingress proxies HTTP/1.1
# to containers, so a Go gRPC server (h2c only) is unreachable through it —
# verified empirically, see the Spike 1 note in the design document. nginx with
# `grpc_pass` terminates TLS, speaks HTTP/2 to the client, and forwards gRPC to
# the backend. AWS ALB with a gRPC target group does the same job natively,
# which is why the production recommendation is unaffected.
#
# Replace __HOST__ before use (see provision.sh — sslip.io gives a real
# Let's Encrypt-issuable hostname for a bare IP, no domain purchase needed).

# Rate limiting. Separate zones so a burst of native-client traffic cannot
# starve the browser path, and vice versa.
limit_req_zone $binary_remote_addr zone=grpc_rl:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=http_rl:10m rate=120r/m;

upstream app_server_grpc {
    server 127.0.0.1:50051;
    keepalive 32;
}

upstream web_proxy {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;

    # ACME challenge must stay on plaintext for renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/2 is mandatory here, not an optimisation: gRPC does not exist
    # without it.
    #
    # Written as `listen ... http2` rather than the standalone `http2 on;`
    # directive, because the latter requires nginx >= 1.25.1 and Ubuntu
    # 24.04 LTS ships 1.24.0. This form works on both (1.25+ emits a
    # deprecation warning but honours it).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __HOST__;

    ssl_certificate     /etc/letsencrypt/live/__HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__HOST__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # A real cert (not self-signed) is what lets iOS App Transport Security
    # and Android's default network security config connect without
    # per-app exceptions. Do not substitute a self-signed cert here.

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # gRPC method paths are /<proto package>.<Service>/<Method>, so the
    # service's fully-qualified name is the routable prefix.
    location /funwithactivity.recommendations.v1.RecommendationsService/ {
        limit_req zone=grpc_rl burst=20 nodelay;

        grpc_pass grpc://app_server_grpc;

        # Must exceed the server's own per-provider deadline (2s) plus
        # fan-out, or nginx cuts the response short and the client sees a
        # transport error instead of the partial-result payload that the
        # resilience demo depends on.
        grpc_read_timeout  30s;
        grpc_send_timeout  30s;

        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Server reflection is intentionally NOT routed here — see web-server/README.md
    # "Not enabled here". Routing it would publish the full service schema to
    # anonymous callers. app-server's authInterceptor still bypasses auth for
    # reflection methods (so in-process/loopback tooling keeps working), but
    # with no route to it, reflection is unreachable from outside.

    # Everything else is the browser path: REST API and the compiled
    # Closure bundle, served by web-proxy over plain HTTP/1.1.
    location / {
        limit_req zone=http_rl burst=40 nodelay;

        proxy_pass http://web_proxy;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
