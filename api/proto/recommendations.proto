syntax = "proto3";

package funwithactivity.recommendations.v1;

option go_package = "github.com/funwithactivity/funwithactivity/api/gen/go/funwithactivity/api;recommendationsv1";

service RecommendationsService {
  rpc GetRecommendations(GetRecommendationsRequest) returns (GetRecommendationsResponse);
  // Reserved, not yet implemented: no server implementation exists and no
  // client calls this. It stays declared on purpose as the intended shape
  // for streaming vitals; the SSE vitals work (server-sent events, not
  // gRPC streaming) is where that feature actually lands. Do not implement
  // this rpc as part of that work — replace/remove this declaration only
  // if the SSE design is deliberately superseded by gRPC streaming instead.
  rpc StreamVitals(StreamVitalsRequest) returns (stream VitalsSample);
  // Health charts for the Charts tab. Additive: a new method alongside
  // existing ones, so a 1.1.x binary that never calls it is unaffected.
  // Deliberately not part of the recommendation fan-out — it calls no
  // vendor and reports no provider status.
  rpc GetHealthCharts(GetHealthChartsRequest) returns (HealthChartsResponse);
}

// Canonical measurement input. Unit conversion happens in each provider
// adapter, never here — this is always metric.
message Measurements {
  double height_cm = 1;
  double weight_kg = 2;
  // 0 means "not supplied". Service 2 requires it; Service 1 does not.
  // A user who declines it still receives Service 1 results — GDPR
  // Art. 5(1)(c) data minimisation expressed as a routing rule.
  int64 birth_date_unix = 3;
}

message GetRecommendationsRequest {
  Measurements measurements = 1;
  // Demo-only fault injection: provider name -> "error" | "timeout" |
  // "malformed". Per-request so the demo needs no restart.
  map<string, string> faults = 2;
}

message Recommendation {
  string title = 1;
  string details = 2;
  string source = 3;
  // Final ranked score only. Raw and normalised scores stay server-side:
  // exposing them would make the ranker's internals contract.
  double score = 4;

  reserved 5 to 15;
  reserved "confidence", "priority", "intent_code";
}

message ProviderStatus {
  string name = 1;
  bool ok = 2;
  // True when Requires() was not satisfied by the supplied measurements.
  bool skipped = 3;
  string error = 4;
  int32 count = 5;
  int64 latency_ms = 6;
  // The provider's configured endpoint, for display only (e.g. Source
  // detail's "Base URL" row). Additive: field 7, added after fields 1-6
  // shipped. Old clients that do not know this field continue to work
  // unchanged — that is the whole point of appending rather than
  // reshaping this message the day before a presentation.
  string base_url = 7;
}

message GetRecommendationsResponse {
  repeated Recommendation recommendations = 1;
  repeated ProviderStatus statuses = 2;
}

message StreamVitalsRequest {
  string metric = 1; // "heart_rate" | "steps"
}

message VitalsSample {
  int64 t_unix_ms = 1;
  double value = 2;
  string unit = 3;
}

// ---------------------------------------------------------------------------
// Health charts (Charts tab)
//
// Carries data only. No colour, no palette index, no styling: each client maps
// Series.key to its own named colour asset, exactly as provider status colours
// already work (StatusOK in Assets.xcassets, colorStatusOk in colors.xml,
// --color-status-ok in main.css). That also means iOS and Android get dark
// mode for free, which a hex string on the wire could never provide.
// ---------------------------------------------------------------------------

message GetHealthChartsRequest {
  Measurements measurements = 1;
}

message HealthChartsResponse {
  repeated Chart charts = 1;
}

enum ChartType {
  CHART_TYPE_UNSPECIFIED = 0;
  CHART_TYPE_BAR = 1;
  CHART_TYPE_PIE = 2;
  CHART_TYPE_GROUPED_BAR = 3;
}

message Chart {
  // Stable identifier: "steps" | "sleep" | "active_minutes".
  string id = 1;
  string title = 2;
  ChartType type = 3;
  // X-axis labels for bar charts; slice labels for pies.
  repeated string categories = 4;
  repeated Series series = 5;
}

message Series {
  // Stable mapping handle: "deep" | "light" | "rem" | "awake" | "steps" |
  // "light_activity" | "moderate" | "vigorous". Clients map THIS to a colour
  // asset, never `label` — a copy edit to display text must not silently
  // recolour a chart.
  string key = 1;
  // Display text. Safe to change without affecting rendering.
  string label = 2;
  // One value per entry in Chart.categories for bar charts; a single value
  // per series for pies.
  repeated double values = 3;
}
